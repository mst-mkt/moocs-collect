[package]
name = "collect-tui"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
collect = { path = "../../" }

reqwest = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
rayon = { workspace = true }
ratatui = "0.28.1"
crossterm = { version = "0.28.1", features = ["event-stream"] }
color-eyre = "0.6.3"
tui-input = "0.10.0"
clap = { version = "4.5.20", features = ["derive"] }
thiserror = "2.0"
keyring = { version = "3.6.2", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[[bin]]
name = "collect-tui"
path = "src/main.rs"
